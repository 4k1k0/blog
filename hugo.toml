baseURL = "https://blog.wako.lat/"
theme = "LoveIt"
title = "./wako"
languageCode = "en"
languageName = "English"

copyright = "{year}" # To make 2007 - 2022. Just add before {year} example: 2007 - {year}
defaultContentLanguage = 'en'
enableRobotsTXT = true
summaryLength = 15

[pagination]
  pagerSize = 5

[params]
  [params.author]
    name = "Rodrigo Patiño"
  [params.header]
    [params.header.title]
      name = "./wako"
  [params.home]
    [params.home.profile]
      avatarURL = "https://i.imgur.com/XD71Uud.jpeg"
  [params.page]
    [params.page.share]
      enable = false
  [params.social]
    Bluesky = "https://bsky.app/profile/wako.bsky.social"
    Mastodon = "https://mstdn.social/@wako"
    Devto = "https://dev.to/4k1k0"
    Github = "https://github.com/4k1k0"

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    pre = ""
    post = ""
    name = "Posts"
    url = "/posts/"
    title = ""
  [[menu.main]]
    weight = 2
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
  [[menu.main]]
    weight = 3
    identifier = "categories"
    pre = ""
    post = ""
    name = "Categories"
    url = "/categories/"
    title = ""

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    noHl = false
    style = "gruvbox"
    tabWidth = 2
