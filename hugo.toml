[module]
[[module.imports]]
path = "github.com/hugo-fixit/FixIt"

baseURL = "https://blog.wako.lat/"
title = "./wako"
languageCode = "en"
languageName = "English"

copyright = "{year}" # To make 2007 - 2022. Just add before {year} example: 2007 - {year}
defaultContentLanguage = 'en'
enableRobotsTXT = true
summaryLength = 15

[pagination]
  pagerSize = 5

[params]
  defaultTheme = "dark"
  [params.author]
    name = "Rodrigo Patiño"
    avatar = "https://i.imgur.com/XD71Uud.jpeg"
  [params.header]
    [params.header.title]
      name = "./wako"
  [params.home]
    [params.home.profile]
      enable = true
      avatarURL = "https://i.imgur.com/XD71Uud.jpeg"
    [params.home.posts]
      enable = false
  [params.page]
    [params.page.share]
      enable = false
  [params.social]
    Bluesky = "wako.bsky.social"
    Mastodon = "@wako@mstdn.social"
    Devto = "4k1k0"
    Github = "4k1k0"

# Menu config
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    pre = ""
    post = ""
    name = "Posts"
    url = "/posts/"
    title = ""
  [[menu.main]]
    weight = 2
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""
  [[menu.main]]
    weight = 3
    identifier = "categories"
    pre = ""
    post = ""
    name = "Categories"
    url = "/categories/"
    title = ""

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = true
    noHl = false
    style = "gruvbox"
    tabWidth = 2
